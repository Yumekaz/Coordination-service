name: Verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coordination-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - name: Complete election, handoff, recovery and HTTP suite
        run: |
          mkdir -p verification
          python -m pytest -q -p no:cacheprovider -W error::pytest.PytestUnhandledThreadExceptionWarning --junitxml=verification/results.xml
      - name: Require full execution
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root=ET.parse('verification/results.xml').getroot()
          cases=root.findall('.//testcase')
          assert len(cases)>=367, f'expected full suite, got {len(cases)}'
          assert len([c for c in cases if 'test_cluster_clock_jumps' in c.attrib.get('classname','')]) == 44, 'clock-jump regressions missing'
          expected={'test_old_heartbeat_cannot_replace_newer_commit_ack[False]',
                    'test_old_heartbeat_cannot_replace_newer_commit_ack[True]',
                    'test_fresh_heartbeat_reports_lower_peer_state_instead_of_hiding_it'}
          executed={case.attrib.get('name') for case in cases}
          assert expected <= executed, f'heartbeat regressions missing: {expected-executed}'
          assert not root.findall('.//skipped'), 'required coordination tests were skipped'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coordination-python-${{ matrix.python }}
          path: verification/results.xml
